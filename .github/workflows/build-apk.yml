name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
        
    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses
        
    - name: Create Flutter project structure
      working-directory: ./mobile-agent
      run: |
        # Backup custom lib/main.dart
        cp lib/main.dart lib/main.dart.backup
        # Create Flutter project structure
        flutter create --org com.voicecli --project-name voice_cli_temp .
        # Restore custom main.dart
        cp lib/main.dart.backup lib/main.dart
        rm lib/main.dart.backup
        
    - name: Skip minSdkVersion fix (handled by flutter create)
      run: echo "Flutter create should handle minSdkVersion"
        
    - name: Skip AndroidManifest fix (handled by flutter create)
      run: echo "Flutter create should handle AndroidManifest"
      
    - name: Install dependencies
      working-directory: ./mobile-agent
      run: flutter pub get
      
    - name: Verify Flutter installation
      run: flutter doctor
      
    - name: Build APK with backend URL
      working-directory: ./mobile-agent
      env:
        BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
      run: |
        # Convert HTTP URL to WebSocket URL
        WS_URL="${BACKEND_URL/http:/wss:}/ws"
        echo "Original backend URL: $BACKEND_URL"
        echo "Converted WebSocket URL: $WS_URL"
        echo "Building APK with WebSocket URL: $WS_URL"
        flutter build apk --release --dart-define=BACKEND_URL=$WS_URL
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: voice-cli-apk
        path: mobile-agent/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
