name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true
        
    - name: Create Flutter project structure
      run: |
        # Create temporary Flutter project in different directory
        cd ..
        flutter create --org com.voicecli --project-name voice_cli_temp temp_flutter
        # Copy only Android structure to mobile-agent
        cp -r temp_flutter/android mobile-agent/
        # Clean up temporary project
        rm -rf temp_flutter
        cd mobile-agent
        
    - name: Install dependencies
      working-directory: ./mobile-agent
      run: flutter pub get
      
    - name: Verify Flutter installation
      run: flutter doctor
      
    - name: Build APK with backend URL
      working-directory: ./mobile-agent
      env:
        BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
      run: |
        # Convert HTTP URL to WebSocket URL
        WS_URL="${BACKEND_URL/http:/wss:}/ws"
        echo "Converting backend URL: $BACKEND_URL -> $WS_URL"
        echo "Building APK with WebSocket URL: $WS_URL"
        flutter build apk --release --dart-define=BACKEND_URL=$WS_URL
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: voice-cli-apk
        path: mobile-agent/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
