name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'
        cache: true

    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses

    - name: Create Flutter project structure
      working-directory: ./mobile-agent
      run: |
        # Backup custom lib files
        cp lib/main.dart lib/main.dart.backup
        cp lib/device_identity.dart lib/device_identity.dart.backup

        # Create Flutter project structure
        flutter create --org com.voicecli --project-name voice_cli_temp .

        # Restore custom lib files
        cp lib/main.dart.backup lib/main.dart
        cp lib/device_identity.dart.backup lib/device_identity.dart
        rm lib/main.dart.backup lib/device_identity.dart.backup

        # Ensure INTERNET permission in the GENERATED main manifest
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ ! -f "$MANIFEST" ]; then
          echo "ERROR: $MANIFEST not found after flutter create"
          exit 1
        fi

        if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
          # Insert permissions right after the opening <manifest ...> tag
          sed -i '0,/<manifest[^>]*>/s||&\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>|' "$MANIFEST"
        fi

        echo "----- Permissions in AndroidManifest.xml -----"
        grep 'uses-permission' "$MANIFEST" || echo "WARNING: no uses-permission found"

    - name: Fix Android minSdkVersion
      working-directory: ./mobile-agent
      run: |
        # Update minSdkVersion to 21 for speech_to_text and permission_handler compatibility
        if [ -f android/app/build.gradle ]; then
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 17/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 18/minSdkVersion 21/g' android/app/build.gradle
        elif [ -f android/app/build.gradle.kts ]; then
          sed -i 's/minSdkVersion = 19/minSdkVersion = 21/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion = 16/minSdkVersion = 21/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion = 17/minSdkVersion = 21/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion = 18/minSdkVersion = 21/g' android/app/build.gradle.kts
        fi

    - name: Install dependencies
      working-directory: ./mobile-agent
      run: flutter pub get

    - name: Verify Flutter installation
      run: flutter doctor

    - name: Build APK with backend URL
      working-directory: ./mobile-agent
      env:
        BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
      run: |
        if [ -z "$BACKEND_URL" ]; then
          echo "ERROR: RENDER_BACKEND_URL secret is not set!"
          exit 1
        fi

        # Strip trailing slash, then convert scheme + ensure /ws
        CLEAN_URL="${BACKEND_URL%/}"
        WS_URL=$(echo "$CLEAN_URL" | sed -e 's|^https://|wss://|' -e 's|^http://|ws://|')

        case "$WS_URL" in
          */ws) ;;
          *) WS_URL="${WS_URL}/ws" ;;
        esac

        echo "========================================="
        echo "Original:  $BACKEND_URL"
        echo "WebSocket: $WS_URL"
        echo "========================================="

        # Must start with ws:// or wss://
        if [[ "$WS_URL" != ws://* && "$WS_URL" != wss://* ]]; then
          echo "ERROR: Invalid WebSocket URL scheme: $WS_URL"
          exit 1
        fi

        flutter build apk --release --dart-define=BACKEND_URL="$WS_URL"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: voice-cli-apk
        path: mobile-agent/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
