name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'
        cache: true

    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses

    - name: Create Flutter project structure
      working-directory: ./mobile-agent
      run: |
        # Create Flutter project structure
        flutter create --org com.voicecli --project-name voice_cli_temp .

        # Restore all our custom tracked files that flutter create might have overwritten
        # (This restores MainActivity.kt, lib files, google-services.json, AndroidManifest.xml, etc.)
        cd ..
        git checkout -- mobile-agent/lib/ mobile-agent/android/

    - name: Inject google-services.json securely
      run: |
        echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > mobile-agent/android/app/google-services.json

    - name: Inject Google Services and Fix Android Gradle
      working-directory: ./mobile-agent
      run: |
        python3 -c '
        import os
        
        # 1. Add to settings.gradle (modern Flutter)
        sg = "android/settings.gradle"
        if os.path.exists(sg):
            with open(sg, "r") as f: c = f.read()
            if "plugins {" in c and "google-services" not in c:
                c = c.replace("plugins {", "plugins {\n    id \"com.google.gms.google-services\" version \"4.3.15\" apply false", 1)
                with open(sg, "w") as f: f.write(c)
        
        # 2. Add to build.gradle (older Flutter / classpath)
        bg = "android/build.gradle"
        if os.path.exists(bg):
            with open(bg, "r") as f: c = f.read()
            if "buildscript {" in c and "dependencies {" in c and "google-services" not in c:
                c = c.replace("dependencies {", "dependencies {\n        classpath \"com.google.gms:google-services:4.3.15\"", 1)
                with open(bg, "w") as f: f.write(c)
            elif "buildscript {" not in c and "plugins {" not in c:
                c = "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath \"com.google.gms:google-services:4.3.15\"\n    }\n}\n" + c
                with open(bg, "w") as f: f.write(c)
        
        # 3. Add to app/build.gradle
        ag = "android/app/build.gradle"
        if os.path.exists(ag):
            with open(ag, "r") as f: c = f.read()
            if "plugins {" in c and "google-services" not in c:
                c = c.replace("plugins {", "plugins {\n    id \"com.google.gms.google-services\"", 1)
            else:
                c += "\napply plugin: \"com.google.gms.google-services\"\n"
            with open(ag, "w") as f: f.write(c)
        '

        # Update minSdkVersion to 21 for speech_to_text and permission_handler compatibility
        APP_GRADLE="android/app/build.gradle"
        if [ -f "$APP_GRADLE" ]; then

          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 17/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 18/minSdkVersion 21/g' android/app/build.gradle
        elif [ -f android/app/build.gradle.kts ]; then
          sed -i 's/minSdkVersion = 19/minSdkVersion = 21/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion = 16/minSdkVersion = 21/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion = 17/minSdkVersion = 21/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion = 18/minSdkVersion = 21/g' android/app/build.gradle.kts
        fi

    - name: Install dependencies
      working-directory: ./mobile-agent
      run: flutter pub get

    - name: Verify Flutter installation
      run: flutter doctor

    - name: Build APK with backend URL
      working-directory: ./mobile-agent
      env:
        BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
      run: |
        if [ -z "$BACKEND_URL" ]; then
          echo "ERROR: RENDER_BACKEND_URL secret is not set!"
          exit 1
        fi

        # Strip trailing slash, then convert scheme + ensure /ws
        CLEAN_URL="${BACKEND_URL%/}"
        WS_URL=$(echo "$CLEAN_URL" | sed -e 's|^https://|wss://|' -e 's|^http://|ws://|')

        case "$WS_URL" in
          */ws) ;;
          *) WS_URL="${WS_URL}/ws" ;;
        esac

        echo "========================================="
        echo "Original:  $BACKEND_URL"
        echo "WebSocket: $WS_URL"
        echo "========================================="

        # Must start with ws:// or wss://
        if [[ "$WS_URL" != ws://* && "$WS_URL" != wss://* ]]; then
          echo "ERROR: Invalid WebSocket URL scheme: $WS_URL"
          exit 1
        fi

        flutter build apk --release --dart-define=BACKEND_URL="$WS_URL"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: voice-cli-apk
        path: mobile-agent/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
