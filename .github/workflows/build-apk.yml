name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.9'
        channel: 'stable'
        cache: true
        
    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses
        
    - name: Create Flutter project structure
      working-directory: ./mobile-agent
      run: |
        # Backup custom lib/main.dart
        cp lib/main.dart lib/main.dart.backup
        # Create Flutter project structure
        flutter create --org com.voicecli --project-name voice_cli_temp .
        # Restore custom main.dart
        cp lib/main.dart.backup lib/main.dart
        rm lib/main.dart.backup
        
    - name: Fix Android minSdkVersion
      working-directory: ./mobile-agent
      run: |
        # Update minSdkVersion to 21 for speech_to_text compatibility
        if [ -f android/app/build.gradle ]; then
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle
        elif [ -f android/app/build.gradle.kts ]; then
          sed -i 's/minSdkVersion = 19/minSdkVersion = 21/g' android/app/build.gradle.kts
        fi
        # Ensure AndroidManifest.xml has required permissions
        if ! grep -q "android.permission.RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
          sed -i '/manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO"/>' android/app/src/main/AndroidManifest.xml
        fi
      
    - name: Install dependencies
      working-directory: ./mobile-agent
      run: flutter pub get
      
    - name: Verify Flutter installation
      run: flutter doctor
      
    - name: Build APK with backend URL
      working-directory: ./mobile-agent
      env:
        BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
      run: |
        # Convert HTTP URL to WebSocket URL
        WS_URL="${BACKEND_URL/http:/wss:}/ws"
        echo "Converting backend URL: $BACKEND_URL -> $WS_URL"
        echo "Building APK with WebSocket URL: $WS_URL"
        flutter build apk --release --dart-define=BACKEND_URL=$WS_URL
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: voice-cli-apk
        path: mobile-agent/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
