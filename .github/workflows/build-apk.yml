name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'
        cache: true

    - name: Accept Android licenses
      run: yes | flutter doctor --android-licenses

    - name: Create Flutter project structure
      working-directory: ./mobile-agent
      run: |
        # Backup custom lib files
        cp lib/main.dart lib/main.dart.backup
        cp lib/device_identity.dart lib/device_identity.dart.backup
        # Create Flutter project structure
        flutter create --org com.voicecli --project-name voice_cli_temp .
        # Restore custom lib files
        cp lib/main.dart.backup lib/main.dart
        cp lib/device_identity.dart.backup lib/device_identity.dart
        rm lib/main.dart.backup lib/device_identity.dart.backup

    - name: Fix Android minSdkVersion
      working-directory: ./mobile-agent
      run: |
        # Update minSdkVersion to 21 for speech_to_text compatibility
        if [ -f android/app/build.gradle ]; then
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle
        elif [ -f android/app/build.gradle.kts ]; then
          sed -i 's/minSdkVersion = 19/minSdkVersion = 21/g' android/app/build.gradle.kts
        fi

    - name: Install dependencies
      working-directory: ./mobile-agent
      run: flutter pub get

    - name: Verify Flutter installation
      run: flutter doctor

    - name: Build APK with backend URL
      working-directory: ./mobile-agent
      env:
        BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
      run: |
        if [ -z "$BACKEND_URL" ]; then
          echo "ERROR: RENDER_BACKEND_URL secret is not set!"
          echo "Please set RENDER_BACKEND_URL in GitHub repository secrets"
          exit 1
        fi

        # Properly convert https → wss and http → ws
        WS_URL="$BACKEND_URL"
        WS_URL="${WS_URL/https:\/\//wss:\/\/}"
        WS_URL="${WS_URL/http:\/\//ws:\/\/}"

        # Ensure /ws path (avoid double /ws)
        if [[ "$WS_URL" != */ws ]]; then
          WS_URL="${WS_URL%/}/ws"
        fi

        echo "Original backend URL: $BACKEND_URL"
        echo "Converted WebSocket URL: $WS_URL"
        echo "Building APK with WebSocket URL: $WS_URL"

        flutter build apk --release --dart-define=BACKEND_URL=$WS_URL

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: voice-cli-apk
        path: mobile-agent/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
