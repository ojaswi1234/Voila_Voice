name: CI — Flutter Mobile

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-agent/**'
      - '.github/workflows/ci-flutter.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile-agent/**'

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      # The repo only partially tracks Android/iOS files.
      # We create the missing scaffolding, then restore our tracked files.
      - name: Scaffold Flutter project & restore sources
        working-directory: mobile-agent
        run: |
          flutter create --org com.voicecli --project-name voice_cli_temp .
          
          # Restore all custom tracked files that flutter create might have overwritten
          cd ..
          git checkout -- mobile-agent/lib/ mobile-agent/android/
          
          # Remove auto-generated test folder because it references MyApp which doesn't exist
          rm -rf mobile-agent/test/

      - name: Create dummy google-services.json for CI
        working-directory: mobile-agent/android/app
        run: |
          echo '{"project_info": {"project_number": "0", "project_id": "ci", "storage_bucket": "ci"}, "client": [{"client_info": {"mobilesdk_app_id": "1:0:android:0", "android_client_info": {"package_name": "com.voicecli.voice_cli_temp"}}, "oauth_client": [], "api_key": [{"current_key": "ci"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}], "configuration_version": "1"}' > google-services.json

      - name: flutter pub get
        working-directory: mobile-agent
        run: flutter pub get

      - name: flutter analyze
        working-directory: mobile-agent
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        working-directory: mobile-agent
        run: flutter test --reporter compact
