name: voice_cli_temp
description: Voice-to-CLI Mobile Agent
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^3.8.5
  web_socket_channel: ^2.4.0
  speech_to_text: ^6.6.0
  flutter_background: ^1.3.1
  permission_handler: ^11.3.0
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  device_info_plus: ^10.0.0
  uuid: ^4.0.0
  google_fonts: ^6.0.0
  siri_wave: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/voila_app_icon.png"

flutter:
  uses-material-design: true
